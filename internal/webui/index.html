<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SSH-Warden Dashboard</title>
<style>
  :root {
    --bg: #0d1117; --surface: #161b22; --border: #30363d;
    --fg: #e6edf3; --dim: #8b949e;
    --green: #3fb950; --yellow: #d29922; --red: #f85149; --blue: #58a6ff; --gray: #6e7681;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { background:var(--bg); color:var(--fg); font-family:'Segoe UI',system-ui,-apple-system,sans-serif; line-height:1.5; padding:16px 20px 56px; }

  /* Header */
  .header { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid var(--border); }
  .brand { display:flex; align-items:center; gap:10px; font-size:20px; font-weight:600; }
  .brand .logo { color:var(--blue); }
  .header-actions { display:flex; align-items:center; gap:10px; }
  .refresh-btn { background:var(--surface); color:var(--fg); border:1px solid var(--border); border-radius:6px; padding:6px 14px; font-size:13px; font-weight:600; cursor:pointer; transition:background .15s; }
  .refresh-btn:hover { background:#21262d; }
  .refresh-btn:disabled, .refresh-btn.spinning { opacity:.6; cursor:default; }

  /* Warning banner */
  .banner { display:none; background:rgba(210,153,34,.12); border:1px solid rgba(210,153,34,.4); color:var(--yellow); padding:10px 14px; border-radius:8px; font-size:13px; margin-bottom:16px; }
  .banner.show { display:block; }

  h2 { font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; color:var(--dim); margin:26px 0 10px; display:flex; align-items:center; gap:8px; }
  h2 .toggle { cursor:pointer; color:var(--blue); font-size:12px; text-transform:none; margin-left:auto; }

  /* Table wrapper for horizontal scroll on small screens */
  .table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; background:var(--surface); border:1px solid var(--border); border-radius:8px; }

  table { width:100%; border-collapse:collapse; min-width:640px; }
  th { text-align:left; padding:10px 14px; font-size:11px; font-weight:600; color:var(--dim); text-transform:uppercase; letter-spacing:.4px; border-bottom:1px solid var(--border); white-space:nowrap; }
  td { padding:10px 14px; font-size:13px; border-bottom:1px solid var(--border); white-space:nowrap; }
  tr:last-child td { border-bottom:none; }
  tr:hover { background:rgba(56,139,253,.04); }
  td .muted { color:var(--dim); }
  td.reason { max-width:260px; white-space:normal; overflow-wrap:break-word; }

  .badge { display:inline-block; padding:2px 8px; border-radius:12px; font-size:11px; font-weight:600; white-space:nowrap; }
  .badge-green { background:rgba(63,185,80,.15); color:var(--green); }
  .badge-yellow { background:rgba(210,153,34,.15); color:var(--yellow); }
  .badge-red { background:rgba(248,81,73,.15); color:var(--red); }
  .badge-gray { background:rgba(110,118,129,.18); color:var(--gray); }

  .btn { border:none; padding:5px 12px; border-radius:6px; font-size:12px; font-weight:600; cursor:pointer; transition:background .15s; }
  .btn-approve { background:var(--green); color:#000; }
  .btn-approve:hover { background:#2ea043; }
  .btn-reject { background:#6e7681; color:#fff; }
  .btn-reject:hover { background:#da3633; }
  .btn-revoke { background:var(--red); color:#fff; }
  .btn-revoke:hover { background:#da3633; }
  .btn:disabled { opacity:.4; cursor:default; }

  .empty { color:var(--dim); font-size:13px; padding:16px 14px; background:var(--surface); border:1px solid var(--border); border-radius:8px; }
  .row { display:flex; gap:6px; flex-wrap:wrap; }

  /* Collapsible audit section */
  .audit-collapsed .table-wrap { display:none; }
  .audit-collapsed h2 .toggle { color:var(--dim); }

  .toast { position:fixed; bottom:24px; right:24px; left:24px; max-width:360px; margin:0 auto; padding:10px 16px; border-radius:8px; font-size:13px; font-weight:500; opacity:0; transition:opacity .3s; pointer-events:none; text-align:center; }
  .toast.show { opacity:1; }
  .toast-ok { background:var(--green); color:#000; }
  .toast-err { background:var(--red); color:#fff; }

  @media (max-width:600px) {
    body { padding:12px 10px 56px; }
    .brand { font-size:17px; }
    th, td { padding:8px 10px; font-size:12px; }
  }
</style>
</head>
<body>

<div id="warning-banner" class="banner">⚠ UI is running without authentication. Set WARDEN_UI_USER &amp; WARDEN_UI_PASSWORD to secure it.</div>

<div class="header">
  <div class="brand"><span class="logo">&#9776;</span> <span>SSH-Warden</span>&nbsp;Dashboard</div>
  <div class="header-actions">
    <span id="updated-at" class="muted" style="color:var(--dim);font-size:12px;"></span>
    <button id="refresh-btn" class="refresh-btn" onclick="manualRefresh()">&#10227; Refresh</button>
  </div>
</div>

<section id="pending-section">
  <h2>Pending Approvals <span class="toggle" onclick="toggleSection('pending-section')">hide</span></h2>
  <div id="pending-wrap" class="table-wrap"><p class="empty">Loading&hellip;</p></div>
</section>

<section id="leases-section">
  <h2>Active Leases <span class="toggle" onclick="toggleSection('leases-section')">hide</span></h2>
  <div id="leases-wrap" class="table-wrap"><p class="empty">Loading&hellip;</p></div>
</section>

<section id="audit-section">
  <h2>Recent Access Logs <span class="toggle" onclick="toggleSection('audit-section')">hide</span></h2>
  <div id="audit-wrap" class="table-wrap"><p class="empty">Loading&hellip;</p></div>
</section>

<div id="toast" class="toast"></div>

<script>
// UI_AUTH_ENABLED is replaced at serve time with 'true' or 'false' depending
// on whether the server configured UI Basic Auth credentials.
const UI_AUTH_ENABLED = __AUTH_ENABLED__;

function toast(msg, ok) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (ok ? 'toast-ok' : 'toast-err');
  setTimeout(() => t.className = 'toast', 2500);
}

function api(method, path, body) {
  const opts = { method };
  if (body !== undefined) {
    opts.headers = { 'Content-Type': 'application/json' };
    opts.body = body;
  }
  return fetch(path, opts).then(r => {
    if (!r.ok) throw new Error(r.status + ' ' + r.statusText);
    const ct = r.headers.get('Content-Type') || '';
    return ct.includes('json') ? r.json() : r.text();
  });
}

function fmtDur(expiresAt) {
  const diff = new Date(expiresAt) - new Date();
  if (diff <= 0) return 'expired';
  const h = Math.floor(diff / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  if (h > 0) return h + 'h ' + m + 'm';
  return m + 'm';
}

// Expiry badge: green >30min, orange <=30min, red <=10min.
function expiryBadge(expiresAt) {
  const diff = new Date(expiresAt) - new Date();
  let cls = 'badge-green';
  if (diff <= 0) cls = 'badge-red';
  else if (diff <= 10 * 60000) cls = 'badge-red';
  else if (diff <= 30 * 60000) cls = 'badge-yellow';
  return '<span class="badge ' + cls + '">' + fmtDur(expiresAt) + '</span>';
}

function renderPending(leases) {
  leases = arr(leases);
  const wrap = document.getElementById('pending-wrap');
  if (!leases.length) { wrap.innerHTML = '<p class="empty">No leases waiting for approval.</p>'; return; }
  let html = '<table><tr><th>ID</th><th>User</th><th>Target</th><th>Reason</th><th>Created</th><th>Actions</th></tr>';
  for (const l of leases) {
    const created = new Date(l.created_at).toLocaleString();
    html += '<tr><td>#' + l.id + '</td><td>' + esc(l.username) + '</td><td>' + esc(l.target_host) + '</td>'
      + '<td class="reason">' + esc(l.reason || '<span class="muted">—</span>') + '</td><td>' + created + '</td>'
      + '<td><div class="row">'
      + '<button class="btn btn-approve" onclick="approve(' + l.id + ',this)">Approve</button> '
      + '<button class="btn btn-reject" onclick="reject(' + l.id + ',this)">Reject</button>'
      + '</div></td></tr>';
  }
  html += '</table>';
  wrap.innerHTML = html;
}

function renderLeases(leases) {
  leases = arr(leases);
  const wrap = document.getElementById('leases-wrap');
  if (!leases.length) { wrap.innerHTML = '<p class="empty">No active leases.</p>'; return; }
  let html = '<table><tr><th>ID</th><th>User</th><th>Target</th><th>Reason</th><th>Expires In</th><th>Status</th><th>Actions</th></tr>';
  for (const l of leases) {
    const cls = l.status === 'approved' ? 'badge-green' : 'badge-yellow';
    html += '<tr><td>#' + l.id + '</td><td>' + esc(l.username) + '</td><td>' + esc(l.target_host) + '</td>'
      + '<td class="reason">' + esc(l.reason || '<span class="muted">—</span>') + '</td>'
      + '<td>' + expiryBadge(l.expires_at) + '</td>'
      + '<td><span class="badge ' + cls + '">' + esc(l.status) + '</span></td>'
      + '<td><button class="btn btn-revoke" onclick="revoke(' + l.id + ',this)">Revoke</button></td></tr>';
  }
  html += '</table>';
  wrap.innerHTML = html;
}

function auditBadge(action) {
  if (/GRANTED/i.test(action)) return 'badge-green';
  if (/DENIED/i.test(action) || /FAILED/i.test(action)) return 'badge-red';
  if (/APPROVED/i.test(action)) return 'badge-green';
  if (/REJECTED/i.test(action)) return 'badge-yellow';
  return 'badge-gray';
}

function renderAudit(logs) {
  logs = arr(logs);
  const wrap = document.getElementById('audit-wrap');
  if (!logs.length) { wrap.innerHTML = '<p class="empty">No access events recorded yet.</p>'; return; }
  let html = '<table><tr><th>Time</th><th>User</th><th>Host</th><th>IP</th><th>Result</th></tr>';
  for (const e of logs) {
    const time = new Date(e.created_at).toLocaleString();
    html += '<tr><td>' + time + '</td><td>' + esc(e.username) + '</td><td>' + esc(e.target_host) + '</td>'
      + '<td>' + esc(e.client_ip || '—') + '</td>'
      + '<td><span class="badge ' + auditBadge(e.action) + '">' + esc(e.action) + '</span></td></tr>';
  }
  html += '</table>';
  wrap.innerHTML = html;
}

function toggleSection(id) {
  const sec = document.getElementById(id);
  sec.classList.toggle('audit-collapsed');
  const t = sec.querySelector('.toggle');
  t.textContent = sec.classList.contains('audit-collapsed') ? 'show' : 'hide';
}

// Confirm then revoke via DELETE /api/v1/leases/{id}
function revoke(id, btn) {
  if (!confirm('Revoke lease #' + id + '? The user will lose SSH access immediately.')) return;
  btn.disabled = true;
  btn.textContent = '...';
  api('DELETE', '/api/v1/leases/' + id)
    .then(() => { toast('Lease #' + id + ' revoked', true); load(); })
    .catch(e => { toast('Failed: ' + e.message, false); btn.disabled = false; btn.textContent = 'Revoke'; });
}

function approve(id, btn) {
  btn.disabled = true;
  btn.textContent = '...';
  api('POST', '/api/v1/leases/' + id + '/approve')
    .then(() => { toast('Lease #' + id + ' approved', true); load(); })
    .catch(e => { toast('Failed: ' + e.message, false); btn.disabled = false; btn.textContent = 'Approve'; });
}

function reject(id, btn) {
  btn.disabled = true;
  btn.textContent = '...';
  api('POST', '/api/v1/leases/' + id + '/reject')
    .then(() => { toast('Lease #' + id + ' rejected', true); load(); })
    .catch(e => { toast('Failed: ' + e.message, false); btn.disabled = false; btn.textContent = 'Reject'; });
}

function load() {
  api('GET', '/api/v1/leases/pending').then(renderPending).catch(e => { console.warn('pending:', e); renderPending([]); });
  api('GET', '/api/v1/leases').then(renderLeases).catch(e => { console.warn('leases:', e); renderLeases([]); });
  api('GET', '/api/v1/audit?limit=10').then(renderAudit).catch(e => { console.warn('audit:', e); renderAudit([]); });
  const now = document.getElementById('updated-at');
  if (now) now.textContent = 'Updated ' + new Date().toLocaleTimeString();
}

// Coerce a possibly-null API payload (JSON null) into an array so the table
// renderers never trip over a non-array value.
function arr(x) { return Array.isArray(x) ? x : []; }

// HTML-escape a string to safely inject dynamic values into the table markup.
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function manualRefresh() {
  const btn = document.getElementById('refresh-btn');
  btn.disabled = true;
  load();
  setTimeout(() => { btn.disabled = false; }, 500);
}

// Show the warning banner only when the server has no UI auth configured.
if (UI_AUTH_ENABLED !== true) {
  document.getElementById('warning-banner').classList.add('show');
}

load();
setInterval(load, 15000);
</script>
</body>
</html>
