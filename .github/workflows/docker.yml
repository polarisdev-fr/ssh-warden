# Builds the SSH-Warden server image for linux/amd64 and linux/arm64 and
# pushes it to Docker Hub. Triggered on version tags (v*.*.*) so each release
# is publishable as ${WARDEN_DOCKERHUB_ORG:-polarisdev}/ssh-warden:vX.Y.Z and
# :latest.
#
# Requires repository secrets:
#   DOCKERHUB_USERNAME   Docker Hub account
#   DOCKERHUB_TOKEN      Docker Hub access token (write/push scope)
name: Docker

on:
  push:
    tags:
      - "v*.*.*"

env:
  # Set this to your Docker Hub namespace optionally via repo/org variable, or
  # change the default below.
  IMAGE: ${{ vars.DOCKERHUB_USERNAME && format('{0}/ssh-warden', vars.DOCKERHUB_USERNAME) || 'polarisdev/ssh-warden' }}

jobs:
  docker-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        run: |
          version="${{ github.ref_name }}"       # e.g. v0.7.0
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=${IMAGE}:${version},${IMAGE}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}